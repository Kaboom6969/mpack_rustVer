[package]
name = "mpack"
version = "0.1.0"
edition = "2021"
description = "Rust port of MPack (MessagePack C library) for Port Mortem 2026"
license = "MIT"
repository = "https://github.com/Kaboom6969/mpack_rustVer"
readme = "README.md"

[lib]
name = "mpack"
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi-harness = ["dep:cc"]
# Full frozen-suite ABI (COMPATIBILITY/EXTENSIONS/tracking/builder/reader/node).
# Mutually exclusive at the layout level with the default embed-writer ABI.
# Used by frozen-link --everything (C everything) and --default-config.
# Frozen-link builds this feature as `cargo rustc --crate-type staticlib` so
# suite symbols (test_malloc / mpack_assert_fail) resolve at final executable link.
full-suite-abi = []

[dependencies]

[[test]]
name = "smoke"
path = "tests/port/smoke.rs"

[[test]]
name = "writer_core"
path = "tests/port/writer_core.rs"

[[test]]
name = "writer_configs"
path = "tests/port/writer_configs.rs"

[[test]]
name = "reader_core"
path = "tests/port/reader_core.rs"

[[test]]
name = "full_abi_layout"
path = "tests/port/full_abi_layout.rs"
required-features = ["full-suite-abi"]

[build-dependencies]
cc = { version = "1.4.0", optional = true }
